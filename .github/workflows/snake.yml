name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7&color_dots=#ebedf0,#e9d5ff,#c084fc,#a855f7,#7e22ce
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d7b8ff&color_dots=#1e1e1e,#3c2754,#694291,#9460c6,#bb86fc

      - name: Respect reduced motion
        shell: python
        run: |
          from pathlib import Path
          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              motion = '<style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>'
              path.write_text(svg.replace('</svg>', motion + '</svg>'))

      - name: Publish the animation
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          author: imrane lakniti <imranelak11@gmail.com>
          committer: imrane lakniti <imranelak11@gmail.com>
          commit_message: Update contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
